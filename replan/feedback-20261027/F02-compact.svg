<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">F02 작은 화면 목록 대체 와이어프레임</title><desc id="desc">960x540, 정적 설계도. ROOT 중앙 요약과 모든 가지 필터가 보이며 적투자 U10은 구매완료 후 다음설정 OFF인 예시. 목록과 상세는 독립 세로 스크롤, 시작버튼은 고정.</desc>
<style>@font-face{font-family:NotoKR;src:url(https://fonts.gstatic.com/s/notosanskr/v40/PbyxFmXiEBPT4ITbgNA5Cgms3VYcOA-vvnIzzuoyeLQ.ttf)}text{font-family:NotoKR,sans-serif;fill:#18212d;font-size:18px}.small{font-size:16px}.head{font-size:20px;font-weight:bold}.card{fill:white;stroke:#647383;stroke-width:2}</style>
<rect width="960" height="540" fill="#f2f5f7"/><text x="20" y="28" class="head">상점 · 작은 화면 목록 보기</text><text x="670" y="28">보유 25G</text><text x="20" y="56" class="small">정적 와이어프레임 · 구현 UI 아님 / 축소 없이 목록으로 재배치</text>
<rect x="338" y="72" width="284" height="48" rx="18" class="card"/><text x="357" y="102">ROOT 시작 · ✓ 화염 기본 보유</text>
<g><rect x="20" y="132" width="168" height="44" rx="6" class="card"/><text x="74" y="160">火 화염</text><rect x="208" y="132" width="168" height="44" rx="6" class="card"/><text x="262" y="160">雪 얼음</text><rect x="396" y="132" width="168" height="44" rx="6" class="card"/><text x="450" y="160">雷 번개</text><rect x="584" y="132" width="168" height="44" rx="6" class="card"/><text x="638" y="160">◎ 공통</text><rect x="772" y="132" width="168" height="44" rx="6" fill="#18212d"/><text x="807" y="160" style="fill:white">◇ 적 투자</text></g>
<path d="M532 188V468M0 476H960" stroke="#a5afb8"/>
<rect x="20" y="192" width="486" height="74" rx="8" class="card"/><text x="36" y="218">U10 적 수 투자 · ✓ 보유</text><text x="36" y="248" class="small">필수: ROOT ✓　|　다음 설정 OFF · 변경 무료</text>
<rect x="20" y="282" width="486" height="74" rx="8" class="card"/><text x="36" y="309">U11 새 적 투자 · + 구매 가능</text><text x="36" y="339" class="small">25G　|　필수: ROOT ✓</text>
<rect x="20" y="372" width="486" height="74" rx="8" class="card"/><text x="36" y="398">U12 엘리트 투자 · ! 5G 부족</text><text x="36" y="429" class="small">30G　|　필수: ROOT ✓</text>
<text x="550" y="215" class="head">적 수 투자 · ✓ 보유</text><text x="550" y="247">다음 설정 OFF · 소유 유지</text><text x="550" y="280">ON이면 다음 전투 적 공급 30 → 45</text><text x="550" y="313" class="small">OFF여도 재구매/환불되지 않습니다.</text><text x="550" y="344" class="small">직전 전투 적용: ON / 다음 전투: OFF</text><rect x="550" y="366" width="386" height="52" rx="8" class="card"/><text x="570" y="399">[OFF] 다음 전투 · 변경 무료</text><text x="550" y="452" class="small">긴 설명은 본문만 세로 스크롤 · CTA 고정</text>
<text x="20" y="502" class="small">적 다음 설정: 적 수 OFF / 새 적 OFF / 엘리트 OFF</text><text x="20" y="527" class="small">앱 종료 / 새 게임 시 초기화 · 저장 미지원</text><rect x="624" y="486" width="312" height="44" rx="8" fill="#18212d"/><text x="672" y="515" style="fill:white">다음 전투 시작 (무료)</text>
</svg>