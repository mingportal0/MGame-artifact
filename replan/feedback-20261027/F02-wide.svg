<title id="title">F02 전체화면 중앙 시작 트리 와이어프레임</title><desc id="desc">구현 UI가 아닌 정적 와이어프레임. 잔액15G, 화염 기본 보유, 화염 집중 선택. 모든 실선은 필수 선행이며 강화끼리 연결하지 않는다.</desc>
